# Publish a release on GitHub (any tag name) and this builds the .rvpkg
# and attaches it to that release.
name: Build and attach rvpkg

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile src/annotated_dailies_export.py
      - run: python build.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rvpkg
